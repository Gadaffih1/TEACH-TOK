<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teach-Tok</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#111;color:#eee}
header{padding:12px 16px;background:#000;font-weight:700}
#feed{height:calc(100vh - 90px);overflow-y:scroll;scroll-snap-type:y mandatory}
.card{height:100%;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;box-sizing:border-box;border-bottom:1px solid #333}
.card video{flex:1;width:100%;min-height:0;background:#000}
button{margin-right:8px;padding:6px 12px}
#studio{padding:12px}
textarea{width:100%;height:80px}
pre{white-space:pre-wrap;background:#222;padding:8px}
</style></head><body>
<header>Teach-Tok</header>
<div id="feed"></div>
<div id="upload" style="padding:12px"><h3>Upload studio</h3>
<input id="tok" placeholder="Your token"><input id="ttl" placeholder="Title"><input id="cpt" placeholder="Concept">
<input id="file" type="file" accept="video/mp4,video/webm,video/quicktime"><button id="up">Publish</button> <span id="upmsg"></span></div>
<div id="studio"><h3>AI Document Studio</h3>
<textarea id="src" placeholder="Paste lesson notes or a topic"></textarea>
<select id="fmt"></select><button id="go">Generate</button><pre id="out"></pre></div>
<script>
const j=(u,o)=>fetch(u,o).then(r=>r.json());
j("/api/feed").then(vs=>{feed.innerHTML=vs.map(v=>`<div class="card"><video src="${encodeURI(v.videoUrl)}" controls></video><h3></h3><div>${v.stats.likes} likes · ${v.stats.comments} comments</div></div>`).join('')||'<p style="padding:16px">No videos yet.</p>';
[...feed.querySelectorAll('h3')].forEach((h,i)=>h.textContent=vs[i].title+' — '+vs[i].concept)});
j('/api/ai/formats').then(f=>fmt.innerHTML=f.map(x=>`<option>${x}</option>`).join(''));
go.onclick=async()=>{out.textContent=JSON.stringify(await j('/api/ai/generate',{method:'POST',body:JSON.stringify({format:fmt.value,text:src.value})}),null,2)};
up.onclick=async()=>{const f=file.files[0];if(!f)return upmsg.textContent='Choose a video';const H={Authorization:['Bearer',tok.value].join(' ')};
const u=await fetch('/api/uploads',{method:'POST',headers:{...H,'Content-Type':f.type},body:f});const ub=await u.json();if(!u.ok)return upmsg.textContent=ub.error;
const v=await fetch('/api/videos',{method:'POST',headers:H,body:JSON.stringify({title:ttl.value,concept:cpt.value,videoUrl:ub.url})});upmsg.textContent=v.ok?'Published! Reload to see it.':(await v.json()).error};
</script></body></html>
